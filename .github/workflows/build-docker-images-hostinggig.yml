name: build-docker-images-hostinggig

# Fork-only build for our own patched tags (e.g. tags that haven't merged
# upstream yet, or never will). Publishes to SEPARATE, private Docker Hub
# repos — cericmathey/hll_rcon_tool-hostinggig and
# cericmathey/hll_rcon_tool_frontend-hostinggig — never the public
# cericmathey/hll_rcon_tool(_frontend) repos the open-source community
# pulls from, and never :latest on either side. Manual dispatch only:
# most fork tags are plain, unmodified syncs of an upstream tag and should
# just keep using upstream's own already-published image — this workflow is
# only for the tags where we've actually diverged.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must exist in this repo)"
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          # Shallow (default depth) + explicit fetch-tags, not fetch-depth: 0
          # (full history). rcon/settings.py runs `git describe --tags`
          # *inside the running container* at boot and that value ends up in
          # CRCON's own API responses (rconweb/api/views.py) — visible in
          # CRCON's own admin UI — so .git can't just be excluded from the
          # image entirely without breaking that. A shallow checkout still
          # contains the exact tag being built (describe finds an exact
          # match trivially), it just omits everything else — full history
          # was baking ~100MB of unrelated .git objects into the image's
          # COPY layer, the one layer that changes (and gets re-pulled) on
          # every single release.
          fetch-tags: true
      # No QEMU — amd64-only build (see the platforms note below), so no
      # emulation is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # This workflow only ever builds for our own fleet (all x86_64) —
      # unlike docker-image.yml/docker-images.yml, which publish to the
      # public repos the open-source community pulls from and do need
      # arm64. Dropping it here (QEMU-emulated arm64 is much slower than
      # native) plus GHA layer caching (separately scoped per image so the
      # backend and frontend caches don't stomp each other) are the two
      # biggest levers on build time — a from-scratch run still pays full
      # price once, but every build after that reuses unchanged layers
      # (base image, apt/uv/npm installs) instead of redoing them.
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: cericmathey/hll_rcon_tool-hostinggig:${{ github.event.inputs.tag }}
          cache-from: type=gha,scope=hostinggig-backend
          cache-to: type=gha,mode=max,scope=hostinggig-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile-frontend
          context: .
          platforms: linux/amd64
          push: true
          tags: cericmathey/hll_rcon_tool_frontend-hostinggig:${{ github.event.inputs.tag }}
          cache-from: type=gha,scope=hostinggig-frontend
          cache-to: type=gha,mode=max,scope=hostinggig-frontend
