name: build-docker-images

on:
  push:
    tags:
      - "*"
      # Fork-only patched tags (see CRCON_FORK_RELEASES.md) publish to the
      # separate cericmathey/hll_rcon_tool-hostinggig repos via manual
      # dispatch (build-docker-images-hostinggig.yml) instead — never to
      # these public repos, and never :latest here. Tag naming convention
      # switched from -hostinggig to -hlladmin (2026-08-22, docker repo
      # names unchanged) — both excluded so older tags stay protected too.
      - "!*-hostinggig*"
      - "!*-hlladmin*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cericmathey/hll_rcon_tool:latest,cericmathey/hll_rcon_tool:${{  github.ref_name }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile-frontend
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cericmathey/hll_rcon_tool_frontend:latest,cericmathey/hll_rcon_tool_frontend:${{  github.ref_name }}
