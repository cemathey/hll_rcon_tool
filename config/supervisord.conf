[supervisord]
logfile=/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
nodaemon=true

[program:worker_launcher]
command=/code/manage.py worker_launcher
environment=LOGGING_FILENAME=worker_launcher_%(ENV_SERVER_NUMBER)s.log
startretries=100
startsecs=1
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=15
; Replaces the standalone broadcasts/expiring_vips/seed_vip/log_event_loop/
; log_stream/log_recorder/auto_settings/routines/live_stats_refresh/automod/
; blacklists/watch_killrate/scoreboard programs below (see
; rcon/worker_launcher.py) - one process imports rcon.cli once and
; os.fork()s a child per program instead of each being its own supervisord
; exec(), so the ~100MB shared import cost is paid once instead of once per
; program. Individual program start/stop/restart from the services page
; now round-trips through this process's own XML-RPC control server
; instead of supervisord's, merged into the same UI (see
; rconweb/api/services.py).

[program:workers]
command=rq worker --with-scheduler -u %(ENV_HLL_REDIS_URL)s
environment=LOGGING_FILENAME=workers_%(ENV_SERVER_NUMBER)s.log
startretries=100
startsecs=1
autostart=true

[program:cron]
environment=LOGGING_FILENAME=cron_%(ENV_SERVER_NUMBER)s.log
command=/bin/bash -c "/usr/bin/crontab /config/crontab && /usr/sbin/cron -f"

[program:scheduler]
environment=LOGGING_FILENAME=scheduler_%(ENV_SERVER_NUMBER)s.log
# Scheduler is right now only used for performance statistics, which interval should be a divisor of 10 (and not
# smaller than 10).
command=rqscheduler --interval 10 -H %(ENV_HLL_REDIS_HOST)s -p %(ENV_HLL_REDIS_PORT)s -d %(ENV_HLL_REDIS_DB)s

[unix_http_server]
file=/tmp/supervisor.sock

[inet_http_server]
port=0.0.0.0:9001

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock         ; use a unix:// URL  for a unix socket

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
